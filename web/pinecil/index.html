<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pinecil</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="bar">
  <span id="brand">Pinecil</span>
  <nav id="appnav"></nav>
  <span id="link" class="pill" data-state="down">connecting…</span>
  <span id="fw" class="muted"></span>
  <span class="spacer"></span>
</header>

<main id="solo">
  <section class="pane pane-pinecil solo" id="pane-pinecil">
    <div class="pane-tools">
      <span id="p-state" class="pill" data-state="none">no data</span>
      <span id="p-ident" class="muted"></span>
      <span class="spacer"></span>
      <button class="btn" id="p-raw-toggle" aria-pressed="false">Raw</button>
    </div>
    <div class="scroll">
      <div class="iron">
        <div class="iron-temp"><span id="p-tip">—</span><span id="p-set" class="muted"></span></div>
        <div class="iron-bar" data-state="cold"><div id="p-bar"></div></div>
        <div id="p-mode" class="iron-mode muted"></div>
      </div>
      <div class="pane-tools">
        <label>setpoint <input id="p-setpoint" type="number" min="10" max="450" step="5" size="4"></label>
        <button class="btn" id="p-apply">Set</button>
        <!-- The presets are the temperatures actually used: leaded, lead-free,
             and a low idle. -->
        <button class="btn" data-settemp="270">270</button>
        <button class="btn" data-settemp="310">310</button>
        <button class="btn" data-settemp="350">350</button>
      </div>
      <div class="kvbox"><div class="sub-head">live</div><div id="p-grid"></div></div>
      <pre id="p-raw" class="mono" hidden></pre>
    </div>
  </section>
</main>

<script type="module" src="/js/pinecil-app.js"></script>
</body>
</html>
