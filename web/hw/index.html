<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hardware</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="bar">
  <span id="brand">Hardware</span>
  <nav id="appnav"></nav>
  <span id="link" class="pill" data-state="down">connecting…</span>
  <span id="fw" class="muted"></span>
  <span class="spacer"></span>
  <button class="btn" id="h-refresh">Refresh</button>
</header>

<main id="solo">
  <section class="pane pane-hw solo" id="pane-hw">
    <div class="scroll">
      <div class="kvbox">
        <div class="sub-head">pin broker <span id="h-sum" class="muted"></span></div>
        <div id="h-pins" class="pingrid"></div>
        <div id="h-pin-detail" class="statline muted">select a pin</div>
      </div>

      <div class="kvbox">
        <div class="sub-head">adc</div>
        <div id="h-adc"></div>
      </div>

      <div class="kvbox">
        <div class="sub-head">i2c</div>
        <div class="pane-tools">
          <label>bus <input id="h-i2c-bus" type="number" value="0" min="0" max="1" size="2"></label>
          <label>sda <input id="h-i2c-sda" type="number" value="4" min="0" max="29" size="2"></label>
          <label>scl <input id="h-i2c-scl" type="number" value="5" min="0" max="29" size="2"></label>
          <button class="btn" id="h-i2c-scan">Scan</button>
          <span id="h-i2c-note" class="muted"></span>
        </div>
        <div id="h-i2c" class="addrs"></div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/js/hw-app.js"></script>
</body>
</html>
