<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bluetooth Gateway</title>
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/app.css">
<!-- Most of what is on screen is addresses, UUIDs, hex and Lua: detectors
     name a confident but arbitrary language for text like that, and a
     translated identifier is a wrong one. -->
<meta name="google" content="notranslate">
</head>
<body>
<!-- Icons, referenced with <use href="#i-...">. First in the body: a <use>
     whose target the parser has not reached yet has to wait for it. -->
<svg id="icon-sprite" hidden aria-hidden="true">
  <symbol id="i-split-h" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M8 2.5v11" stroke="currentColor"/></symbol>
  <symbol id="i-split-v" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M1.5 8h13" stroke="currentColor"/></symbol>
  <symbol id="i-float" viewBox="0 0 16 16"><rect x="1.5" y="4.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor"/><path d="M5.5 4.5v-2a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-3" fill="none" stroke="currentColor"/></symbol>
  <symbol id="i-tile" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M4.5 5.5h7v5h-7z" fill="none" stroke="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <!-- Swap all splits: the same frame as i-split-h/v with both dividers, and
       an arrow to say the two trade places. -->
  <symbol id="i-transpose" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M8 2.5v11M1.5 8h13" stroke="currentColor" stroke-dasharray="2 1.6"/><path d="M4.6 6.2L6.4 8l-1.8 1.8M11.4 6.2L9.6 8l1.8 1.8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <!-- Settings. A gear drawn for 16px rather than scaled down to it: a ring,
       a hub and six teeth, which stays crisp where a faithful cog outline
       turns to mud at this size. -->
  <symbol id="i-settings" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.6" fill="none" stroke="currentColor"/><circle cx="8" cy="8" r="1.7" fill="none" stroke="currentColor"/><path d="M8 3.4V1.7M8 12.6v1.7M11.98 5.7l1.48-.85M4.02 10.3l-1.48.85M11.98 10.3l1.48.85M4.02 5.7L2.54 4.85" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <!-- Tabbed view: the frame with a tab strip along the top. -->
  <symbol id="i-tabs" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M1.5 6h13M6 2.5V6M10 2.5V6" stroke="currentColor"/></symbol>
  <!-- Editor titlebar and sidebar. Same 16px stroke style as the window
       icons, so the two rows of buttons read as one family. -->
  <symbol id="i-save" viewBox="0 0 16 16"><path d="M2.5 2.5h9l2 2v9h-11z" fill="none" stroke="currentColor"/><path d="M5 2.5v3.5h5V2.5M5 13.5V9.5h6v4" fill="none" stroke="currentColor"/></symbol>
  <symbol id="i-run" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z" fill="none" stroke="currentColor" stroke-linejoin="round"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1" fill="none" stroke="currentColor"/></symbol>
  <symbol id="i-new" viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9z" fill="none" stroke="currentColor"/><path d="M8 7v5M5.5 9.5h5" stroke="currentColor"/></symbol>
  <symbol id="i-upload" viewBox="0 0 16 16"><path d="M8 11V2.5M4.5 6L8 2.5 11.5 6M2.5 11v2.5h11V11" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2.5V11M4.5 7.5L8 11l3.5-3.5M2.5 11v2.5h11V11" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sidebar" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M6 2.5v11" stroke="currentColor"/></symbol>
  <symbol id="i-more" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="12.5" cy="8" r="1" fill="currentColor"/></symbol>
</svg>

<div id="toolbar">
  <span id="conn-status" class="disconnected">Disconnected</span>
  <span id="conn-info" translate="no"></span>
  <span class="spacer"></span>
  <button id="swap-splits-btn" class="tool-btn" type="button"
          title="Swap all splits &#8212; horizontal &#8596; vertical (Alt+R)"
          aria-label="Swap all splits"><svg aria-hidden="true"><use href="#i-transpose" xlink:href="#i-transpose"/></svg></button>
  <button id="tabs-btn" class="tool-btn" type="button" aria-pressed="false"
          title="Tabbed view &#8212; one window at a time (Alt+Shift+T)"
          aria-label="Tabbed view"><svg aria-hidden="true"><use href="#i-tabs" xlink:href="#i-tabs"/></svg></button>
  <button id="settings-btn" class="tool-btn" type="button" title="Settings (Alt+S)" aria-label="Settings"><svg aria-hidden="true"><use href="#i-settings" xlink:href="#i-settings"/></svg></button>
</div>

<!-- The workspace: js/layout.js builds the split tree of tiles in #tiles and
     positions floating windows in #floating-layer. Every window's element
     lives in #pane-park until a tile claims it, and goes back there rather
     than being destroyed, so an editor keeps its buffer and a scanner its
     list across every re-tiling. -->
<div id="workspace" translate="no">
  <div id="tiles"></div>
  <div id="floating-layer" hidden></div>
</div>
<nav id="tabbar" hidden translate="no"></nav>
<div id="keyhint" class="keyhint" hidden translate="no"></div>
<div id="pane-park" hidden translate="no"></div>

<div id="settings-modal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-label="Settings" tabindex="-1">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="modal-header">
      <span>Settings</span>
      <button class="modal-close" id="settings-close-btn" aria-label="Close">&times;</button>
    </div>
    <!-- Sections are built by their modules (js/settings/*.js), each a
         <details class="sect"> so collapsing one is native and costs its
         render() nothing. -->
    <div class="modal-body" id="settings-body"></div>
  </div>
</div>

<div id="help-modal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-label="Keyboard shortcuts" tabindex="-1" data-nav-scroll>
    <div class="modal-header">
      <span>Keyboard shortcuts</span>
      <input id="help-filter" type="search" class="help-filter" placeholder="Type to filter&#8230;"
             aria-label="Filter shortcuts" autocomplete="off" spellcheck="false">
      <button class="modal-close" id="help-close-btn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
